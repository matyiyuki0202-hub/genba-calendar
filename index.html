<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#1463ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="現場カレンダー">

<link rel="manifest" href="manifest.json">

<title>現場カレンダー</title>

<style>
:root{
  --blue:#1463ff;
  --bg:#f6f8fb;
  --text:#172033;
  --muted:#6d7482;
  --line:#e5e8ef;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;
  color:var(--text);
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
  border:0;
  background:none;
}

.app{
  max-width:520px;
  margin:auto;
  min-height:100vh;
  background:#fff;
  box-shadow:0 0 30px #00000010;
}

header{
  height:72px;
  display:flex;
  align-items:center;
  gap:14px;
  padding:0 18px;
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  background:#fff;
  z-index:5;
}

header h1{
  font-size:22px;
  margin:0;
  flex:1;
}

.icon{
  font-size:25px;
}

.blue{
  color:var(--blue);
}

main{
  padding:16px 14px 100px;
}

.toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}

.month{
  font-size:21px;
  font-weight:800;
}

.navbtn{
  border:1px solid var(--line);
  border-radius:10px;
  padding:8px 12px;
  background:#fff;
}

/* 表示切替 */
.views{
  display:flex;
  gap:7px;
  margin-bottom:12px;
}

.views button{
  flex:1;
  padding:10px 5px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#fff;
}

.views .active{
  background:var(--blue);
  color:white;
  border-color:var(--blue);
}

/* 月表示 */
.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  border-top:1px solid var(--line);
  border-left:1px solid var(--line);
}

.cell{
  min-height:82px;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  padding:5px;
  font-size:12px;
}

.dow{
  min-height:32px;
  text-align:center;
  font-weight:700;
  background:#fafbfc;
}

.sun{
  color:#e33;
}

.sat{
  color:#1560e8;
}

.day{
  font-weight:700;
  font-size:13px;
}

.today{
  background:#eef4ff;
}

.selected{
  outline:2px solid var(--blue);
  outline-offset:-2px;
}

.event{
  margin-top:4px;
  border-radius:6px;
  padding:4px;
  background:#e8f1ff;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.event.green{
  background:#e9f8ee;
}

.event.yellow{
  background:#fff4cf;
}

.event.purple{
  background:#f0eaff;
}

.event.blue{
  background:#e8f1ff;
}

/* 週表示 */
.week-wrap{
  overflow-x:auto;
  border:1px solid var(--line);
  border-radius:10px;
}

.week-grid{
  display:grid;
  grid-template-columns:repeat(7,minmax(105px,1fr));
  min-width:735px;
}

.week-head{
  padding:10px 5px;
  text-align:center;
  font-weight:800;
  background:#fafbfc;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
}

.week-day{
  min-height:300px;
  padding:6px;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
}

.week-day-number{
  font-weight:800;
  margin-bottom:6px;
}

.week-day.selected-day{
  background:#eef4ff;
}

.week-event{
  margin-bottom:6px;
  padding:7px;
  border-radius:7px;
  background:#e8f1ff;
  font-size:12px;
}

.week-event.green{
  background:#e9f8ee;
}

.week-event.yellow{
  background:#fff4cf;
}

.week-event.purple{
  background:#f0eaff;
}

/* 日表示 */
.day-view{
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden;
}

.day-view-header{
  padding:15px;
  background:#fafbfc;
  border-bottom:1px solid var(--line);
  font-weight:800;
  font-size:18px;
}

.day-row{
  display:flex;
  gap:12px;
  padding:14px;
  border-bottom:1px solid var(--line);
}

.day-row:last-child{
  border-bottom:0;
}

.day-time{
  width:55px;
  color:var(--muted);
  font-size:13px;
}

.day-info{
  flex:1;
}

/* リスト表示 */
.list-view .card{
  margin-bottom:8px;
}

.list-date{
  font-weight:800;
  margin:18px 2px 8px;
}

/* 共通 */
.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:18px 2px 8px;
  font-weight:800;
}

.card{
  border:1px solid var(--line);
  border-radius:12px;
  margin-bottom:8px;
  padding:12px;
  display:flex;
  gap:10px;
  align-items:center;
  background:#fff;
}

.bar{
  width:5px;
  height:58px;
  border-radius:5px;
  background:#f0b400;
}

.card .info{
  flex:1;
}

.time{
  font-size:13px;
  color:var(--muted);
  width:58px;
}

.title{
  font-weight:800;
}

.meta{
  font-size:12px;
  color:var(--muted);
  margin-top:3px;
}

.status{
  background:#eaf2ff;
  color:var(--blue);
  padding:5px 8px;
  border-radius:99px;
  font-size:11px;
}

.fab{
  position:fixed;
  right:max(calc((100vw - 520px)/2 + 18px),18px);
  bottom:78px;
  width:58px;
  height:58px;
  border-radius:50%;
  background:var(--blue);
  color:#fff;
  font-size:32px;
  box-shadow:0 8px 20px #1463ff44;
}

nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(520px,100%);
  height:70px;
  background:#fff;
  border-top:1px solid var(--line);
  display:flex;
  z-index:6;
}

nav button{
  flex:1;
  font-size:11px;
  color:#707784;
}

nav button.active{
  color:var(--blue);
  font-weight:800;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

/* フォーム */
.form label{
  display:block;
  font-weight:700;
  margin:13px 0 6px;
}

.form input,
.form textarea,
.form select{
  width:100%;
  padding:12px;
  border:1px solid #dfe3eb;
  border-radius:10px;
  background:#fff;
}

.form textarea{
  min-height:90px;
}

.save{
  width:100%;
  padding:14px;
  background:var(--blue);
  color:#fff;
  border-radius:10px;
  margin-top:18px;
  font-weight:800;
}

/* 社員 */
.employee{
  display:flex;
  gap:12px;
  padding:14px 0;
  border-bottom:1px solid var(--line);
  align-items:center;
}

.avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  background:#e8edf5;
  display:grid;
  place-items:center;
  font-weight:800;
}

.empinfo{
  flex:1;
}

.badge{
  font-size:11px;
  background:#eaf8ed;
  color:#24944a;
  border-radius:99px;
  padding:5px 8px;
}

.search{
  width:100%;
  padding:12px;
  border:1px solid var(--line);
  border-radius:10px;
  margin-bottom:10px;
}

/* モーダル */
.modal{
  position:fixed;
  inset:0;
  background:#0006;
  display:none;
  align-items:flex-end;
  z-index:10;
}

.modal.open{
  display:flex;
}

.sheet{
  background:#fff;
  width:min(520px,100%);
  margin:auto auto 0;
  border-radius:18px 18px 0 0;
  padding:18px;
  max-height:90vh;
  overflow:auto;
}

.sheethead{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.sheet h2{
  margin:0;
}

@media(min-width:700px){
  .app{
    min-height:100vh;
  }
}
</style>

<!-- ==================== 予定一覧 ==================== -->

<section id="plansPage" class="page">

</main>


<!-- 予定追加ボタン -->

<button

</button>


<!-- ==================== 下部メニュー ==================== -->

<nav>

</button>

</button>

</button>

  •••<br>その他

</nav>

<!-- ==================== 予定登録 ==================== -->

<div class="modal" id="modal">

<div class="sheet">

<div class="sheethead">

  ✕
</button>

</div>

<div class="form">

<label>タイトル *</label>

<input

>

  id="fStart"

  id="fEnd"

>

  id="fDesc"
  placeholder="作業内容を入力">

<label>担当者</label>

<option>田中 大輔</option>

>

<script>

/* =====================================================

const employees=[

},

},

{

},

{

 role:"現場担当",

},

{

 role:"事務 / スケジュール管理",
 phone:"090-6789-0123"
},

{
 name:"伊藤 美咲",
 role:"事務 / 請求・見積",
 phone:"090-7890-1234"
}

];


/* =====================================================
   予定データ
===================================================== */

let events=
JSON.parse(
  localStorage.getItem("companyEvents") || "null"
)
||
[

{
 date:"2026-08-04",
 title:"B店 漏電調査",
 site:"B店",
 time:"09:00",
 type:"green"
},

{
 date:"2026-08-06",
 title:"C店 照明交換",
 site:"C店",
 time:"10:00",
 type:"yellow"
},

{
 date:"2026-08-07",
 title:"D店 ドア修理",
 site:"D店",
 time:"13:00",
 type:"purple"
},

{
 date:"2026-08-20",
 title:"K店 照明交換工事",
 site:"K店",
 time:"09:00",
 type:"yellow"
},

{
 date:"2026-08-20",
 title:"P店 コンセント修理",
 site:"P店",
 time:"13:00",
 type:"blue"
},

{
 date:"2026-08-20",
 title:"Q店 漏電調査",
 site:"Q店",
 time:"15:30",
 type:"green"
},

{
 date:"2026-08-24",
 title:"M店 漏電調査",
 site:"M店",
 time:"09:00",
 type:"yellow"
}

];


/* =====================================================
   基本状態
===================================================== */

let current=new Date(2026,7,20);

let selected="2026-08-20";

let viewMode="month";


/* =====================================================
   日付関係
===================================================== */

function pad(n){

  return String(n).padStart(2,"0");

}


function iso(d){

  return d.getFullYear()
    +"-"
    +pad(d.getMonth()+1)
    +"-"
    +pad(d.getDate());

}


function formatJapaneseDate(key){

  const d=new Date(key+"T00:00:00");

  const week=[
    "日",
    "月",
    "火",
    "水",
    "木",
    "金",
    "土"
  ];

  return d.getFullYear()
    +"年"
    +(d.getMonth()+1)
    +"月"
    +d.getDate()
    +"日（"
    +week[d.getDay()]
    +"）";

}


/* =====================================================
   表示切替
===================================================== */

function setView(mode,btn){

  viewMode=mode;

  document
    .querySelectorAll(".views button")
    .forEach(x=>{
      x.classList.remove("active");
    });

  btn.classList.add("active");

  renderCalendar();

}


/* =====================================================
   前へ・次へ
===================================================== */

function navigate(direction){

  if(viewMode==="month"){

    current=new Date(
      current.getFullYear(),
      current.getMonth()+direction,
      1
    );

  }

  else if(viewMode==="week"){

    current=new Date(
      current.getFullYear(),
      current.getMonth(),
      current.getDate()+direction*7
    );

    selected=iso(current);

  }

  else if(viewMode==="day"){

    current=new Date(
      current.getFullYear(),
      current.getMonth(),
      current.getDate()+direction
    );

    selected=iso(current);

  }

  else if(viewMode==="list"){

    current=new Date(
      current.getFullYear(),
      current.getMonth()+direction,
      1
    );

  }

  renderCalendar();

}


/* =====================================================
   今日
===================================================== */

function goToday(){

  const now=new Date();

  current=new Date(now);

  selected=iso(now);

  renderCalendar();

}


/* =====================================================
   メイン描画
===================================================== */

function renderCalendar(){

  const label=document.getElementById("monthLabel");

  if(viewMode==="month"){

    label.textContent=
      current.getFullYear()
      +"年"
      +(current.getMonth()+1)
      +"月";

    renderMonth();

  }

  else if(viewMode==="week"){

    renderWeek();

  }

  else if(viewMode==="day"){

    renderDay();

  }

  else if(viewMode==="list"){

    renderList();

  }

  renderDayEvents();

  renderAllEvents();

}


/* =====================================================
   月表示
===================================================== */

function renderMonth(){

  const y=current.getFullYear();

  const m=current.getMonth();

  const cal=document.getElementById("calendar");

  cal.className="calendar";

  cal.innerHTML="";


  const weekdays=[
    "月",
    "火",
    "水",
    "木",
    "金",
    "土",
    "日"
  ];


  weekdays.forEach((x,i)=>{

    const e=document.createElement("div");

    e.className=
      "cell dow "
      +(i===5?"sat":"")
      +(i===6?"sun":"");

    e.textContent=x;

    cal.appendChild(e);

  });


  const first=new Date(y,m,1);

  const start=
    (first.getDay()+6)%7;

  const days=
    new Date(y,m+1,0).getDate();


  for(let i=0;i<start;i++){

    const e=document.createElement("div");

    e.className="cell";

    e.style.color="#aaa";

    cal.appendChild(e);

  }


  for(let d=1;d<=days;d++){

    const date=new Date(y,m,d);

    const key=iso(date);

    const e=document.createElement("div");

    e.className=
      "cell "
      +(key===selected?"selected ":"");

    if(key===iso(new Date())){

      e.classList.add("today");

    }


    e.onclick=()=>{

      selected=key;

      renderCalendar();

    };


    const dn=document.createElement("div");

    dn.className=
      "day "
      +(date.getDay()===0?"sun ":"")
      +(date.getDay()===6?"sat ":"");

    dn.textContent=d;

    e.appendChild(dn);


    const dayEvents=
      events.filter(x=>x.date===key);


    dayEvents
      .slice(0,2)
      .forEach(x=>{

        const v=document.createElement("div");

        v.className=
          "event "
          +(x.type||"blue");

        v.textContent=x.title;

        e.appendChild(v);

      });


    if(dayEvents.length>2){

      const more=document.createElement("div");

      more.className="meta";

      more.textContent=
        "他 "
        +(dayEvents.length-2)
        +"件";

      e.appendChild(more);

    }


    cal.appendChild(e);

  }


  while(cal.children.length<49){

    const e=document.createElement("div");

    e.className="cell";

    cal.appendChild(e);

  }

}


/* =====================================================
   週表示
===================================================== */

function getMonday(date){

  const d=new Date(date);

  const day=d.getDay();

  const diff=day===0 ? -6 : 1-day;

  d.setDate(d.getDate()+diff);

  return d;

}


function renderWeek(){

  const wrap=document.createElement("div");

  wrap.className="week-wrap";


  const grid=document.createElement("div");

  grid.className="week-grid";


  const monday=getMonday(current);


  const sunday=new Date(monday);

  sunday.setDate(monday.getDate()+6);


  document.getElementById("monthLabel").textContent=
    (monday.getMonth()+1)
    +"月"
    +monday.getDate()
    +"日 ～ "
    +(sunday.getMonth()+1)
    +"月"
    +sunday.getDate()
    +"日";


  const weekdays=[
    "月",
    "火",
    "水",
    "木",
    "金",
    "土",
    "日"
  ];


  for(let i=0;i<7;i++){

    const d=new Date(monday);

    d.setDate(monday.getDate()+i);

    const key=iso(d);


    const head=document.createElement("div");

    head.className="week-head";

    if(i===5)head.classList.add("sat");

    if(i===6)head.classList.add("sun");


    head.textContent=
      weekdays[i]
      +" "
      +(d.getMonth()+1)
      +"/"
      +d.getDate();


    grid.appendChild(head);

  }


  for(let i=0;i<7;i++){

    const d=new Date(monday);

    d.setDate(monday.getDate()+i);

    const key=iso(d);


    const box=document.createElement("div");

    box.className="week-day";


    if(key===selected){

      box.classList.add("selected-day");

    }


    box.onclick=()=>{

      selected=key;

      renderCalendar();

    };


    const number=document.createElement("div");

    number.className="week-day-number";

    number.textContent=
      d.getDate()
      +"日";


    box.appendChild(number);


    const dayEvents=
      events
        .filter(x=>x.date===key)
        .sort((a,b)=>
          (a.time||"").localeCompare(b.time||"")
        );


    dayEvents.forEach(x=>{

      const ev=document.createElement("div");

      ev.className=
        "week-event "
        +(x.type||"blue");


      ev.innerHTML=
        "<b>"
        +(x.time||"終日")
        +"</b><br>"
        +escapeHtml(x.title)
        +"<br>"
        +"<span class='meta'>"
        +escapeHtml(x.site||"")
        +"</span>";


      box.appendChild(ev);

    });


    grid.appendChild(box);

  }


  wrap.appendChild(grid);


  const calendar=
    document.getElementById("calendar");

  calendar.className="";

  calendar.innerHTML="";

  calendar.appendChild(wrap);

}


/* =====================================================
   日表示
===================================================== */

function renderDay(){

  const key=selected;

  const d=new Date(key+"T00:00:00");


  document.getElementById("monthLabel").textContent=
    (d.getMonth()+1)
    +"月"
    +d.getDate()
    +"日";


  const wrap=document.createElement("div");

  wrap.className="day-view";


  const header=document.createElement("div");

  header.className="day-view-header";

  header.textContent=
    formatJapaneseDate(key);


  wrap.appendChild(header);


  const dayEvents=
    events
      .filter(x=>x.date===key)
      .sort((a,b)=>
        (a.time||"").localeCompare(b.time||"")
      );


  if(dayEvents.length===0){

    const empty=document.createElement("div");

    empty.className="meta";

    empty.style.padding="20px";

    empty.textContent=
      "この日の予定はありません。";

    wrap.appendChild(empty);

  }


  dayEvents.forEach(x=>{

    const row=document.createElement("div");

    row.className="day-row";


    const time=document.createElement("div");

    time.className="day-time";

    time.textContent=
      x.time||"終日";


    const info=document.createElement("div");

    info.className="day-info";


    info.innerHTML=
      "<div class='title'>"
      +escapeHtml(x.title)
      +"</div>"
      +"<div class='meta'>⌖ "
      +escapeHtml(x.site||"")
      +"</div>"
      +"<div class='meta'>担当："
      +escapeHtml(x.member||"未設定")
      +"</div>";


    row.appendChild(time);

    row.appendChild(info);

    wrap.appendChild(row);

  });


  const calendar=
    document.getElementById("calendar");

  calendar.className="";

  calendar.innerHTML="";

  calendar.appendChild(wrap);

}


/* =====================================================
   リスト表示
===================================================== */

function renderList(){

  document.getElementById("monthLabel").textContent=
    "予定リスト";


  const wrap=document.createElement("div");

  wrap.className="list-view";


  const sorted=
    events
      .slice()
      .sort((a,b)=>{

        const aa=
          a.date+" "+(a.time||"99:99");

        const bb=
          b.date+" "+(b.time||"99:99");

        return aa.localeCompare(bb);

      });


  let lastDate="";


  sorted.forEach(x=>{

    if(x.date!==lastDate){

      const dateTitle=
        document.createElement("div");

      dateTitle.className="list-date";

      dateTitle.textContent=
        formatJapaneseDate(x.date);

      wrap.appendChild(dateTitle);

      lastDate=x.date;

    }


    const card=
      document.createElement("div");

    card.className="card";


    const bar=
      document.createElement("div");

    bar.className="bar";


    const time=
      document.createElement("div");

    time.className="time";

    time.textContent=
      x.time||"終日";


    const info=
      document.createElement("div");

    info.className="info";

    info.innerHTML=
      "<div class='title'>"
      +escapeHtml(x.title)
      +"</div>"
      +"<div class='meta'>⌖ "
      +escapeHtml(x.site||"")
      +"</div>"
      +"<div class='meta'>担当："
      +escapeHtml(x.member||"未設定")
      +"</div>";


    const status=
      document.createElement("span");

    status.className="status";

    status.textContent="未完了";


    card.appendChild(bar);

    card.appendChild(time);

    card.appendChild(info);

    card.appendChild(status);

    wrap.appendChild(card);

  });


  if(sorted.length===0){

    const empty=
      document.createElement("p");

    empty.className="meta";

    empty.textContent=
      "登録された予定はありません。";

    wrap.appendChild(empty);

  }


  const calendar=
    document.getElementById("calendar");

  calendar.className="";

  calendar.innerHTML="";

  calendar.appendChild(wrap);

}

function showPage(id,btn){

    .querySelectorAll(".page")
    .forEach(x=>
      x.classList.remove("active")
    );


  document
    .getElementById(id)
    .classList.add("active");


  document
    .querySelectorAll("nav button")
    .forEach(x=>

    );

    renderEmployees();

  }

}

===================================================== */

function openModal(){

  document
    .getElementById("modal")
    .classList.add("open");


  document.getElementById("fStart").value=
    selected+"T09:00";


  document.getElementById("fEnd").value=
    selected+"T17:00";

}


function closeModal(){

  document
    .getElementById("modal")
    .classList.remove("open");

}


function saveEvent(){

  const title=
    document
      .getElementById("fTitle")
      .value
      .trim();


  if(!title){

    alert("タイトルを入力してください");

    return;

  }


  const s=
    document
      .getElementById("fStart")
      .value;


  if(!s){

    alert("開始日時を入力してください");

    return;

  }


  const e={

    date:s.slice(0,10),

    title:title,

    site:
      document
        .getElementById("fSite")
        .value,

    time:s.slice(11,16),

    type:"blue",

    member:
      document
        .getElementById("fMember")
        .value,

    desc:
      document
        .getElementById("fDesc")
        .value

  };


  events.push(e);


  localStorage.setItem(
    "companyEvents",
    JSON.stringify(events)
  );


  selected=e.date;

  current=
    new Date(
      e.date+"T00:00:00"
    );


  closeModal();


  renderCalendar();


  document.getElementById("fTitle")
    .value="";


  alert("予定を登録しました");

}

/* =====================================================
   HTMLエスケープ
===================================================== */

function escapeHtml(str){

  return String(str||"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
